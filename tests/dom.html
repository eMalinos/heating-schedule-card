<!doctype html>
<html lang="cs">
<head><meta charset="utf-8"><title>heating-schedule-card DOM checks</title>
<style>body{margin:0;padding:16px;background:#efefef;font-family:Roboto,system-ui,sans-serif}</style>
</head>
<body>
<!--
  Browser checks with a fake hass (states + callWS returning tests/fixtures/schedules.json). Run:
  python3 -m http.server 8765 &
  "Google Chrome" --headless=new --virtual-time-budget=5000 --dump-dom http://localhost:8765/tests/dom.html | grep RESULT
  Screenshots (canvas layouts, fixed clock Mon 14:20): dom.html?shot=week|fallback|states[&dark=1][&w=390]
  "Google Chrome" --headless=new --window-size=640,1100 --screenshot=out.png "http://localhost:8765/tests/dom.html?shot=week"
-->
<div id="box" style="width:480px"></div>
<pre id="out"></pre>
<script type="module">
  const errors = [];
  addEventListener('error', (e) => errors.push(e.message));
  const origError = console.error;
  console.error = (...a) => { errors.push(a.join(' ')); origError(...a); };

  if (new URLSearchParams(location.search).has('shot')) await import('./shots.mjs');
  else {
    await import('../dist/heating-schedule-card.js');
    const fixture = await (await fetch('./fixtures/schedules.json')).json();

    const ws = [], services = [], api = [];
    let onEvent = null, unsubscribed = 0, items = fixture;
    const hass = {
      states: {
        'climate.kitchen_valve': { state: 'heat', attributes: { friendly_name: 'Kuchyň', temperature: 21 } },
        'sensor.heating_program_heating_circuit_1': { state: 'auto', attributes: { programs: ['auto', 'odd', 'vacation'], program_names: { auto: 'Výchozí', odd: 'Lichý týden', vacation: 'Dovolená' } } },
      },
      callApi: async (method, path, body) => { api.push({ method, path, body }); },
      callWS: async (msg) => { ws.push(msg); return items; },
      callService: async (domain, service, data) => { services.push({ domain, service, data }); },
      connection: { subscribeMessage: async (cb, msg) => { onEvent = cb; ws.push(msg); return () => { unsubscribed++; }; } },
    };

    const card = document.createElement('heating-schedule-card');
    card.setConfig({ circuits: [{ id: 'heating_circuit_1', name: 'Přízemí', valves: ['climate.kitchen_valve', 'climate.bedroom_valve'] }] });
    card.hass = hass;
    document.getElementById('box').appendChild(card);
    const root = card.shadowRoot;
    const tick = (ms = 50) => new Promise((r) => setTimeout(r, ms));
    await tick(100);

    const r = {};
    r.loaded = ws.some((m) => m.type === 'scheduler') && ws.some((m) => m.type === 'scheduler_updated');
    r.title = root.querySelector('.head b').textContent === 'Kuchyň' && root.querySelector('.head .sec').textContent === 'Přízemí';
    r.programs = [...root.querySelectorAll('.chip:not(.add)')].map((p) => p.textContent).join() === 'Výchozí,Lichý týden,Dovolená'
      && root.querySelector('.chip .dot') && root.querySelector('.chip[aria-pressed="true"]').textContent === 'Výchozí';
    r.rows = root.querySelectorAll('.row').length === 1 && root.querySelector('.open b').textContent === 'Po–Ne'
      && root.querySelector('.seg').textContent === '21°' && root.querySelector('.now').dataset.kind === 'normal';
    r.editable = !root.textContent.includes('Jen ke čtení');
    r.valvePicker = [...root.querySelectorAll('select option')].map((o) => o.value).join() === 'climate.kitchen_valve,climate.bedroom_valve';

    // pause toggle: only the tag changes, written through scheduler/edit
    root.querySelector('input[data-a="pause"]').click();
    await tick(100);
    r.pause = api.length === 1 && api[0].path === 'scheduler/edit' && api[0].body.schedule_id === '848813'
      && api[0].body.tags.includes('paused') && api[0].body.tags.includes('program:auto') && api[0].body.timeslots.length === 1;

    // a program without own schedule: fallback note, dimmed Výchozí rows, copy button writes program-tagged copies
    root.querySelector('.chip[data-id="odd"]').click();
    r.fallback = root.textContent.includes('Lichý týden používá výchozí rozvrh') && root.querySelectorAll('.rows.dim .row').length === 1;
    api.length = 0;
    root.querySelector('[data-a="copyDefault"]').click();
    await tick(100);
    r.copy = api.length === 1 && api[0].path === 'scheduler/add' && api[0].body.tags.includes('program:odd') && !api[0].body.tags.includes('paused')
      && !('schedule_id' in api[0].body);
    root.querySelector('.chip[data-id="auto"]').click();

    // created schedules: one of ours (switch entity not there yet) and a foreign one (valve not in the config)
    const n = ws.length;
    const mine = { ...fixture[0], schedule_id: 'new1', entity_id: 'switch.schedule_new1', weekdays: ['mon'], tags: ['program:auto'] };
    const foreign = { ...mine, schedule_id: 'for1', entity_id: 'switch.schedule_for1', timeslots: [{ ...mine.timeslots[0], actions: [{ ...mine.timeslots[0].actions[0], entity_id: 'climate.other' }] }] };
    items = [...fixture, mine, foreign];
    onEvent({ event: 'scheduler_item_created', schedule_id: 'new1' });
    onEvent({ event: 'scheduler_item_created', schedule_id: 'for1' });
    onEvent({ event: 'scheduler_item_updated', schedule_id: 'new1' });
    await tick(500);
    r.debounced = ws.length === n + 1;
    r.newRow = root.querySelectorAll('.row').length === 2;
    r.waitsForSwitch = services.length === 0;

    // an unrelated state change does not rebuild the DOM
    const cardEl = root.querySelector('ha-card');
    const withSwitches = { ...hass, states: { ...hass.states, 'switch.schedule_new1': { state: 'on' }, 'switch.schedule_for1': { state: 'on' }, 'sensor.x': { state: '1' } } };
    card.hass = withSwitches;
    r.noRebuild = root.querySelector('ha-card') === cardEl;
    r.noEarlyLoad = ws.length === n + 1;

    // the next load turns off only ours, once; the foreign schedule is never touched
    onEvent({ event: 'scheduler_item_updated', schedule_id: 'new1' });
    await tick(500);
    onEvent({ event: 'scheduler_item_updated', schedule_id: 'new1' });
    await tick(500);
    r.turnedOff = JSON.stringify(services) === JSON.stringify([{ domain: 'switch', service: 'turn_off', data: { entity_id: 'switch.schedule_new1' } }]);

    // disconnect unsubscribes; reconnect re-subscribes and reloads
    card.remove();
    await tick();
    r.unsubscribed = unsubscribed === 1;
    const m = ws.length;
    document.getElementById('box').appendChild(card);
    await tick(200);
    r.reloaded = ws.slice(m).some((x) => x.type === 'scheduler');
    r.resubscribed = ws.slice(m).some((x) => x.type === 'scheduler_updated');

    // a rejected subscription shows an error line and is retried on the next hass update
    let fail = true;
    const hass2 = { ...withSwitches, connection: { subscribeMessage: async () => { if (fail) throw new Error('unknown command'); return () => {}; } } };
    const card2 = document.createElement('heating-schedule-card');
    card2.setConfig({ circuits: [{ id: 'c', valves: ['climate.kitchen_valve'] }] });
    card2.hass = hass2;
    document.getElementById('box').appendChild(card2);
    await tick(100);
    r.subError = card2.shadowRoot.textContent.includes('Chyba: unknown command');
    fail = false;
    card2.hass = { ...hass2 };
    await tick(100);
    r.subRetried = !card2.shadowRoot.textContent.includes('Chyba');
    card2.remove();


    // a schedule the card cannot represent: read-only row, no pause switch, no editor tap, never written
    items = [{ ...fixture[0], repeat_type: 'single' }];
    const card3 = document.createElement('heating-schedule-card');
    card3.setConfig({ circuits: [{ id: 'c', valves: ['climate.kitchen_valve'] }] });
    card3.hass = hass;
    document.getElementById('box').appendChild(card3);
    await tick(150);
    const r3 = card3.shadowRoot;
    r.readOnly = r3.querySelectorAll('.row.ro').length === 1 && r3.textContent.includes('Jen ke čtení (upraveno jinde)')
      && !r3.querySelector('input[data-a="pause"]') && !r3.querySelector('.row [data-a="open"]');
    card3.remove();

    // --- review fixes ---
    const CID = 'heating_circuit_1';
    const mkHass = (over = {}) => {
      const h = {
        states: { ...hass.states }, callWS: async () => items, callApi: async () => {}, callService: async () => {},
        connection: { subscribeMessage: async () => () => {} }, ...over,
      };
      return h;
    };
    const mkCard = async (h, cfg = { circuits: [{ id: CID, valves: ['climate.kitchen_valve'] }] }) => {
      const c = document.createElement('heating-schedule-card');
      c.setConfig(cfg);
      if (h) c.hass = h;
      document.getElementById('box').appendChild(c);
      await tick(150);
      return c;
    };
    const prog = (state) => ({ ...hass.states, 'sensor.heating_program_heating_circuit_1': { state, attributes: hass.states['sensor.heating_program_heating_circuit_1'].attributes } });
    const picked = (c) => c.shadowRoot.querySelector('.chip[aria-pressed="true"]')?.textContent;
    items = fixture;

    // the shown program follows the running one until a chip is picked (setConfig first, hass arrives late)
    const c4 = await mkCard(null);
    c4.hass = mkHass({ states: prog('vacation') });
    await tick(100);
    r.followsRunning = picked(c4) === 'Dovolená' && c4.shadowRoot.querySelector('.seg').textContent === '16°';
    c4.hass = mkHass({ states: prog('auto') });
    r.followsChange = picked(c4) === 'Výchozí';
    c4.shadowRoot.querySelector('.chip[data-id="odd"]').click();
    c4.hass = mkHass({ states: prog('vacation') });
    r.pickedSticks = picked(c4) === 'Lichý týden';
    c4.remove();

    // a failed write keeps its error through the reload that follows
    const c5 = await mkCard(mkHass({ callApi: async () => { throw new Error('boom'); } }));
    c5.shadowRoot.querySelector('input[data-a="pause"]').click();
    await tick(150);
    r.errStays = c5.shadowRoot.querySelector('.err')?.textContent === 'Chyba: boom'
      && c5.shadowRoot.querySelector('input[data-a="pause"]').checked === true;
    // a pause that bails out (busy) puts the checkbox back
    c5._busy.add('848813');
    const cb = c5.shadowRoot.querySelector('input[data-a="pause"]');
    cb.checked = false;
    cb.dispatchEvent(new Event('change', { bubbles: true }));
    r.pauseBail = c5.shadowRoot.querySelector('input[data-a="pause"]').checked === true;
    c5.remove();

    // fallback copy is all or nothing: the second add fails, the first copy is removed again
    const two = [fixture[0], { ...fixture[0], schedule_id: 'second', entity_id: 'switch.schedule_second', weekdays: ['mon'] }];
    let store = [...two], adds = 0;
    const removed = [];
    const c6 = await mkCard(mkHass({
      callWS: async () => store,
      callApi: async (m, path, body) => {
        if (path === 'scheduler/add') {
          if (++adds === 2) throw new Error('second add failed');
          store = [...store, { ...two[0], schedule_id: 'copy1', entity_id: 'switch.schedule_copy1', tags: body.tags }];
        } else if (path === 'scheduler/remove') { removed.push(body.schedule_id); store = store.filter((x) => x.schedule_id !== body.schedule_id); }
      },
    }));
    c6.shadowRoot.querySelector('.chip[data-id="odd"]').click();
    c6.shadowRoot.querySelector('[data-a="copyDefault"]').click();
    await tick(250);
    r.rollback = adds === 2 && removed.join() === 'copy1' && store.length === 2 && c6.shadowRoot.querySelector('.err')?.textContent === 'Chyba: second add failed';
    c6.remove();

    // "Podle rozvrhu": a rejected service call shows the error line
    const manual = { ...hass.states, 'climate.kitchen_valve': { state: 'heat', attributes: { friendly_name: 'Kuchyň', temperature: 23 } },
      'sensor.heating_schedule_heating_circuit_1': { state: 'auto', attributes: { targets: { 'climate.kitchen_valve': 21 } } } };
    const c7 = await mkCard(mkHass({ states: manual, callService: async () => { throw new Error('no press'); } }));
    c7.shadowRoot.querySelector('[data-a="sync"]').click();
    await tick(100);
    r.syncError = c7.shadowRoot.querySelector('.err')?.textContent === 'Chyba: no press';
    c7.remove();

    // no rebuild while a control has the focus; the deferred render runs on blur; an unchanged output is never assigned
    const c8 = await mkCard(mkHass(), { circuits: [{ id: CID, valves: ['climate.kitchen_valve', 'climate.bedroom_valve'] }] });
    const sel = c8.shadowRoot.querySelector('select');
    sel.focus();
    const named = { ...hass.states, 'climate.bedroom_valve': { state: 'heat', attributes: { friendly_name: 'Ložnice' } } };
    c8.hass = mkHass({ states: named });
    r.deferred = c8.shadowRoot.activeElement === sel && c8.shadowRoot.querySelector('select') === sel
      && ![...sel.options].some((o) => o.textContent === 'Ložnice');
    sel.blur();
    await tick(50);
    r.rendersOnBlur = [...c8.shadowRoot.querySelectorAll('select option')].some((o) => o.textContent === 'Ložnice');
    const card8 = c8.shadowRoot.querySelector('ha-card');
    c8.hass = mkHass({ states: { ...named, 'climate.bedroom_valve': { state: 'heat', attributes: { friendly_name: 'Ložnice', current_temperature: 20 } } } });
    c8._render();
    r.sameHtml = c8.shadowRoot.querySelector('ha-card') === card8;
    c8.remove();

    // --- editor (#342) ---
    const click = (c, sel) => { const el = c.shadowRoot.querySelector(sel); if (!el) throw new Error('no element ' + sel + ' in ' + c.shadowRoot.querySelector('ha-card').textContent.replace(/\s+/g, ' ').slice(0, 200)); el.click(); };
    const btnOn = (c, sel) => !c.shadowRoot.querySelector(sel).disabled;
    const weekdays = { ...fixture[0], schedule_id: 'wk', entity_id: 'switch.schedule_wk', weekdays: ['mon', 'tue', 'wed', 'thu', 'fri'], name: 'keep me' };
    items = [weekdays];
    let calls = [];
    const withValve = { valve: 'climate.kitchen_valve', circuits: [{ id: CID, valves: ['climate.kitchen_valve'] }] };
    const c9 = await mkCard(mkHass({ callApi: async (m, path, body) => { calls.push({ path, body }); } }), withValve);
    click(c9, '.row [data-a="open"]');
    const sr = c9.shadowRoot;
    r.edOpens = !!sr.querySelector('.edbar') && sr.textContent.includes('Upravit rozvrh') && sr.textContent.includes('Kuchyň · Výchozí')
      && sr.querySelectorAll('.day[aria-pressed="true"]').length === 5 && sr.querySelectorAll('.edseg').length === 1;
    // split, select the second half, + temperature, move its start, toggle Sat on, save
    click(c9, '[data-a="split"]');
    r.edSplit = sr.querySelectorAll('.edseg').length === 2 && sr.querySelectorAll('.handle').length === 1 && sr.querySelector('.hlabels').textContent === '12:00';
    click(c9, '[data-a="sel"][data-k="1"]');
    click(c9, '[data-a="tup"]'); click(c9, '[data-a="tup"]');
    click(c9, '[data-a="sdn"]');
    click(c9, '[data-a="day"][data-k="sat"]');
    r.edFocusKept = sr.activeElement === null || sr.activeElement.dataset.a === 'day'; // no focus loss errors
    r.edState = sr.querySelector('.dial b').textContent.startsWith('22') && sr.textContent.includes('11:45–24:00');
    click(c9, '[data-a="save"]');
    await tick(150);
    const b = calls[0]?.body;
    r.edSave = calls.length === 1 && calls[0].path === 'scheduler/edit' && b.schedule_id === 'wk' && b.name === 'keep me' && b.repeat_type === 'repeat'
      && b.weekdays.join() === 'mon,tue,wed,thu,fri,sat' && b.tags.includes('program:auto') && b.tags.includes('kitchen_valve')
      && JSON.stringify(b.timeslots.map((t) => [t.start, t.stop, t.actions[0].service_data.temperature])) === JSON.stringify([['00:00:00', '11:45:00', 21], ['11:45:00', '23:59:00', 22]]);
    r.edBack = !c9.shadowRoot.querySelector('.edbar') && !!c9.shadowRoot.querySelector('.rows');

    // new schedule: free weekdays prefilled (Sat, Sun), one slot at 20 °C, saved through scheduler/add, no id
    calls = [];
    click(c9, '[data-a="add"]');
    r.newEd = sr.textContent.includes('Nový rozvrh') && [...sr.querySelectorAll('.day[aria-pressed="true"]')].map((x) => x.textContent).join() === 'So,Ne'
      && sr.querySelector('.dial b').textContent.startsWith('20') && !sr.querySelector('[data-a="del"]');
    click(c9, '[data-a="save"]');
    await tick(150);
    r.newSave = calls.length === 1 && calls[0].path === 'scheduler/add' && !('schedule_id' in calls[0].body) && calls[0].body.weekdays.join() === 'sat,sun'
      && calls[0].body.tags.join() === 'program:auto' && calls[0].body.timeslots.length === 1 && calls[0].body.timeslots[0].stop === '23:59:00';

    // a day another schedule of this valve and program uses blocks saving, with the reason
    click(c9, '[data-a="add"]');
    click(c9, '[data-a="day"][data-k="mon"]');
    r.conflict = !btnOn(c9, '[data-a="save"]') && sr.querySelector('.why').textContent === 'Po už má jiný rozvrh';
    click(c9, '[data-a="day"][data-k="mon"]'); click(c9, '[data-a="day"][data-k="sat"]'); click(c9, '[data-a="day"][data-k="sun"]');
    r.noDays = !btnOn(c9, '[data-a="save"]') && sr.querySelector('.why').textContent === 'Vyber aspoň jeden den';
    click(c9, '[data-a="back"][data-k="c"]');
    r.cancel = !!sr.querySelector('.rows') && calls.length === 1;

    // delete asks first, then removes; a failed write keeps the editor and the error
    calls = [];
    click(c9, '.row [data-a="open"]');
    click(c9, '[data-a="del"]');
    r.delConfirm = !!sr.querySelector('.confirm') && calls.length === 0;
    click(c9, '[data-a="delno"]');
    click(c9, '[data-a="del"]'); click(c9, '[data-a="delok"]');
    await tick(150);
    r.delDone = calls.length === 1 && calls[0].path === 'scheduler/remove' && calls[0].body.schedule_id === 'wk' && !!sr.querySelector('.rows');
    c9.remove();

    const c10 = await mkCard(mkHass({ callApi: async () => { throw new Error('nope'); } }));
    click(c10, '.row [data-a="open"]');
    click(c10, '[data-a="save"]');
    await tick(150);
    r.saveErr = !!c10.shadowRoot.querySelector('.edbar') && c10.shadowRoot.querySelector('.err')?.textContent === 'Chyba: nope';
    c10.remove();

    // read-only schedules and missing ones never open; a handler can veto the editor
    items = [{ ...weekdays, repeat_type: 'single' }];
    const c11 = await mkCard(mkHass());
    const ro = c11._schedules[0];
    c11._onEdit({ detail: { schedule: ro } });
    r.roNoEditor = !c11.shadowRoot.querySelector('.edbar');
    c11.remove();
    items = [weekdays];
    const c12 = await mkCard(mkHass());
    c12.addEventListener('hsc-edit', (e) => e.preventDefault());
    click(c12, '.row [data-a="open"]');
    r.veto = !c12.shadowRoot.querySelector('.edbar');
    c12.remove();

    // general card (no `valve`): add asks for the valves, one schedule per valve; the second add fails -> the first is removed again
    const two2 = { circuits: [{ id: CID, valves: ['climate.kitchen_valve', 'climate.bedroom_valve'] }] };
    store = [weekdays]; adds = 0; removed.length = 0;
    const bed = { ...hass.states, 'climate.bedroom_valve': { state: 'heat', attributes: { friendly_name: 'Ložnice' } } };
    calls = [];
    const c13 = await mkCard(mkHass({
      states: bed, callWS: async () => store,
      callApi: async (m, path, body) => {
        calls.push({ path, body });
        if (path === 'scheduler/add') {
          if (++adds === 2 && c13._failSecond) throw new Error('bedroom failed');
          store = [...store, { ...weekdays, schedule_id: `n${adds}`, entity_id: `switch.schedule_n${adds}`, weekdays: body.weekdays, tags: body.tags, timeslots: body.timeslots }];
        } else if (path === 'scheduler/remove') { removed.push(body.schedule_id); store = store.filter((x) => x.schedule_id !== body.schedule_id); }
      },
    }), two2);
    click(c13, '[data-a="add"]');
    const s13 = c13.shadowRoot;
    r.picker = s13.textContent.includes('Pro které hlavice?') && s13.querySelectorAll('.tile[aria-pressed="true"]').length === 1 && s13.textContent.includes('Pokračovat (1)')
      && s13.textContent.includes('1 rozvrh · Výchozí') && s13.textContent.includes('bez rozvrhu');
    click(c13, '[data-a="pv"][data-k="climate.bedroom_valve"]');
    r.pickerCount = s13.textContent.includes('Pokračovat (2)');
    click(c13, '[data-a="go"]');
    r.pickerToEditor = !!s13.querySelector('.edbar') && s13.textContent.includes('Kuchyň, Ložnice · Výchozí');
    click(c13, '[data-a="back"][data-k=""]');
    r.backToPicker = s13.textContent.includes('Pro které hlavice?') && s13.textContent.includes('Pokračovat (2)');
    click(c13, '[data-a="go"]');
    c13._failSecond = true;
    click(c13, '[data-a="save"]');
    await tick(300);
    r.multiRollback = adds === 2 && removed.join() === 'n1' && store.length === 1 && !!s13.querySelector('.edbar') && s13.querySelector('.err')?.textContent === 'Chyba: bedroom failed';
    c13._failSecond = false; adds = 0; calls = [];
    click(c13, '[data-a="save"]');
    await tick(300);
    r.multiSave = calls.filter((x) => x.path === 'scheduler/add').map((x) => x.body.timeslots[0].actions[0].entity_id).join() === 'climate.kitchen_valve,climate.bedroom_valve'
      && !!s13.querySelector('.rows');
    c13.remove();

    // --- editor review fixes ---
    // a schedule with a 06:00 first start keeps it: carry-over part shown muted, not selectable, starts written back
    const late = { ...weekdays, timeslots: [{ ...weekdays.timeslots[0], start: '06:00', stop: '20:00' }, { ...weekdays.timeslots[0], start: '20:00', stop: '23:59', actions: [{ ...weekdays.timeslots[0].actions[0], service_data: { temperature: 19 } }] }] };
    items = [late];
    calls = [];
    const c14 = await mkCard(mkHass({ callApi: async (m, path, body) => { calls.push({ path, body }); } }), withValve);
    click(c14, '.row [data-a="open"]');
    const s14 = c14.shadowRoot;
    r.carry = !!s14.querySelector('.edseg.carry') && !s14.querySelector('.edseg.carry[data-a]') && s14.querySelectorAll('button.edseg').length === 2
      && s14.querySelector('.edseg.carry').textContent === 'z předchozího dne';
    click(c14, '[data-a="day"][data-k="sat"]');
    click(c14, '[data-a="save"]');
    await tick(150);
    r.keepsStart = calls.length === 1 && calls[0].body.timeslots.map((t) => t.start).join() === '06:00:00,20:00:00' && calls[0].body.timeslots[1].stop === '23:59:00';

    // stored version changed since the editor opened: no overwrite, "Načíst znovu" reloads it; paused / name come from the stored one
    items = [weekdays];
    calls = [];
    const c15 = await mkCard(mkHass({ callApi: async (m, path, body) => { calls.push({ path, body }); } }), withValve);
    const s15 = c15.shadowRoot;
    click(c15, '.row [data-a="open"]');
    items = [{ ...weekdays, tags: [...weekdays.tags, 'paused'], name: 'renamed' }]; // only paused / name: written with the stored ones
    click(c15, '[data-a="day"][data-k="sat"]');
    click(c15, '[data-a="save"]');
    await tick(150);
    r.keepsStored = calls.length === 1 && calls[0].body.tags.includes('paused') && calls[0].body.name === 'renamed' && calls[0].body.weekdays.join() === 'mon,tue,wed,thu,fri,sat';
    calls = [];
    items = [weekdays];

    setVal(cw, '#newprog', 'Chata');
    click(cw, '[data-a="pg-add"]');
    await tick(14000);
    r.v2NoReadBack = cw.shadowRoot.textContent.includes('Chyba: Seznam se možná neuložil — zkontrolujte');
    cw.remove();

    r.noErrors = errors.length === 0;
    const ok = Object.values(r).every(Boolean);
    document.getElementById('out').textContent = 'RESULT ' + (ok ? 'PASS ' : 'FAIL ') + JSON.stringify(r) + (errors.length ? ' ERRORS ' + JSON.stringify(errors) : '');
  }
</script>
</body>
</html>
